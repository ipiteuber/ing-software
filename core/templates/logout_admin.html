{% extends "base/base.html" %}

{% block content %}
<div class="pt-24 pb-16 px-4 sm:px-6 lg:px-8 min-h-screen bg-gray-50 flex items-center justify-center">
  <div class="w-full max-w-sm animate-slide-up">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">

      <div class="w-14 h-14 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-5">
        <svg class="w-7 h-7 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      </div>

      <h2 class="font-serif text-xl font-bold text-dark mb-2">Sesión Cerrada</h2>
      <p class="text-sm text-gray-500 mb-6">Has cerrado sesión correctamente.</p>

      <a href="{% url 'login_admin' %}" class="inline-flex items-center px-6 py-3 bg-dark text-white font-medium text-sm rounded-lg hover:bg-gray-800 transition-colors">
        Volver a Iniciar Sesión
      </a>
    </div>
  </div>
</div>
{% endblock %}
