{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hotel Pacific Reef{% endblock %}</title>

  <link rel="icon" href="{% static 'images/icon.png' %}" type="image/png">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            accent: '#b8960c',
            'accent-light': '#d4b44a',
            dark: '#1a1a1a',
          },
        },
      },
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Custom animations only -->
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>

<body class="min-h-screen flex flex-col bg-white font-sans text-dark antialiased">

  {% include "components/navbar.html" %}

  {% if messages %}
  <div class="max-w-xl mx-auto px-4 pt-24 pb-0">
    {% for message in messages %}
    <div class="px-4 py-3 mb-3 rounded-lg text-sm
      {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
      {% elif message.tags == 'success' %}bg-green-50 text-green-700 border border-green-200
      {% elif message.tags == 'info' %}bg-blue-50 text-blue-700 border border-blue-200
      {% else %}bg-gray-50 text-gray-700 border border-gray-200{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <main class="flex-1">
    {% block content %}
    {% endblock %}
  </main>

  <footer>
    {% include "components/footer.html" %}
  </footer>

  <script src="{% static 'js/general.js' %}"></script>

</body>

</html>
