{% extends "base/base.html" %}
{% load static %}

{% block content %}
<div class="pt-24 pb-16 px-4 sm:px-6 lg:px-8 min-h-screen bg-gray-50 flex items-center justify-center">
  <div class="w-full max-w-sm animate-slide-up">

    <!-- Logo/Brand -->
    <div class="text-center mb-8">
      <img src="{% static 'images/icon.png' %}" alt="Pacific Reef" class="w-12 h-12 mx-auto mb-4">
      <h1 class="font-serif text-2xl font-bold text-dark">Acceso Administrador</h1>
      <p class="text-sm text-gray-500 mt-1">Panel de gestión del hotel</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
      <form method="post" class="space-y-5">
        {% csrf_token %}

        <div>
          <label for="id_id_admin" class="block text-sm font-medium text-gray-700 mb-1.5">ID Administrador</label>
          <input type="text" name="id_admin" id="id_id_admin" required
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-dark/20 focus:border-dark outline-none transition-all">
        </div>

        <div>
          <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" name="email" id="id_email" required
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-dark/20 focus:border-dark outline-none transition-all">
        </div>

        <button type="submit" class="w-full py-3 bg-dark text-white font-medium text-sm rounded-lg hover:bg-gray-800 transition-colors">
          Ingresar
        </button>
      </form>
    </div>

    <p class="text-center mt-4">
      <a href="{% url 'landing_page' %}" class="text-sm text-gray-400 hover:text-dark transition-colors">&larr; Volver al inicio</a>
    </p>
  </div>
</div>
{% endblock %}
